#################################
#          ANIMATIONS           #
#################################
# Optimized for picom-ftlabs-git
animations = true;
animation-stiffness-in-tag = 500;
animation-stiffness-tag-change = 500;
animation-window-mass = 0.4;
animation-dampening = 30;
animation-clamping = true;

# Transition styles
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up";

# BSPWM Desktop switching animations
animation-for-prev-tag = "minimize";
enable-fading-prev-tag = true;
animation-for-next-tag = "slide-in-center";
enable-fading-next-tag = true;

#################################
#           CORNERS             #
#################################
corner-radius = 12;
detect-rounded-corners = true;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#        TRANSPARENCY           #
#################################
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = false;

# Opacity rules for specific applications
opacity-rule = [
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'google-chrome'",
  "100:class_g = 'Firefox'",
  "100:class_g = 'vlc'",
  "100:class_g = 'mpv'"
];

# Prevent Chrome from becoming transparent when losing focus
focus-exclude = [
  "class_g = 'Google-chrome'",
  "class_g = 'google-chrome'"
];

#################################
#             BLUR              #
#################################
# Dual-kawase is high-performance and aesthetically pleasing
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;

# Exclude specific windows and popups from blur
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Google-chrome'",
  "class_g = 'google-chrome'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#        GENERAL SETTINGS       #
#################################
backend = "glx";
vsync = true;

# Required for smooth animations in FT-LABS fork
use-damage = false;

# Performance optimizations for GLX backend
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

#################################
#          WINTYPES             #
#################################
# Rules for specific window types (menus, tooltips, etc.)
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; blur = false; }
  dropdown_menu = { opacity = 1.0; blur = false; }
  menu = { blur = false; }
};
